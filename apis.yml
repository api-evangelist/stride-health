name: Stride Health
description: 'Stride Health is a benefits platform that helps independent, gig, and part-time
  workers access portable benefits that stay with the individual regardless of where or how
  they work. Stride connects people to affordable health, dental, vision, and life insurance,
  and provides tax tools, mileage/expense tracking, and savings features for the self-employed.
  The company reports 4.6 million independent workers served, $8+ billion saved on insurance
  and taxes, and 130+ partner companies. Stride operates a private B2B partner integration
  (embedded in partner apps such as gig-work platforms) but publishes no public developer API,
  API documentation, or developer portal.'
